<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux AI Studio Pro</title>
    <style>
        :root {
            --bg-color: #08080c;
            --panel-bg: #12121a;
            --primary: #00f0ff;
            --accent: #7000ff;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-color: #222230;
            /* Phóng to cơ bản 30% */
            --scale-factor: 1.3; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(2rem * var(--scale-factor));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: calc(1000px * var(--scale-factor)); /* Phóng to chiều rộng */
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: calc(2rem * var(--scale-factor));
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        h1 {
            grid-column: 1 / -1;
            font-size: calc(2.2rem * var(--scale-factor));
            text-align: center;
            color: var(--primary);
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: calc(1.5rem * var(--scale-factor));
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: calc(0.85rem * var(--scale-factor));
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background-color: #050508;
            border: 1px solid var(--border-color);
            color: white;
            padding: calc(0.8rem * var(--scale-factor));
            border-radius: 8px;
            margin-bottom: calc(1.5rem * var(--scale-factor));
            font-size: calc(0.9rem * var(--scale-factor));
            outline: none;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        button {
            width: 100%;
            padding: calc(1rem * var(--scale-factor));
            font-size: calc(0.9rem * var(--scale-factor));
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { box-shadow: 0 0 20px var(--primary); }

        .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .btn-secondary:hover { color: white; border-color: white; }

        .btn-danger { background: #331111; color: #ff5555; border: 1px solid #552222; }
        .btn-danger:hover { background: #551111; color: #ff8888; }

        .output-area {
            min-height: calc(400px * var(--scale-factor));
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050508;
            position: relative;
            overflow: hidden;
        }

        .output-img { max-width: 100%; height: auto; display: none; }

        .loader {
            display: none;
            width: 60px;
            height: 60px;
            border: 5px solid #222;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>FLUX STUDIO PRO</h1>

        <div class="panel">
            <form id="gen-form">
                <label>Mô hình Klein</label>
                <select id="model-select" name="model"></select>

                <label>Câu lệnh miêu tả</label>
                <textarea id="prompt" name="prompt" rows="4" placeholder="Một phi hành gia trên sao hỏa, phong cách cyberpunk..." required></textarea>

                <label>Ảnh tham chiếu</label>
                <input type="file" id="images" name="images" multiple accept="image/*">

                <button type="submit" class="btn-primary" id="gen-btn">Bắt đầu tạo ảnh</button>
            </form>

            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="resetApp()">Làm mới (Reset)</button>
                <button type="button" class="btn-danger" onclick="clearUploads()">Dọn dẹp Uploads</button>
            </div>
            <div id="msg" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>
        </div>

        <div class="panel">
            <label>Kết quả đầu ra</label>
            <div class="output-area">
                <div class="loader" id="loader"></div>
                <div id="placeholder-text" style="color: #444;">Dữ liệu sẽ hiển thị tại đây</div>
                <img id="result-img" class="output-img">
            </div>
        </div>
    </div>

    <script>
        // Load models
        async function loadModels() {
            const res = await fetch('/api/models');
            const data = await res.json();
            const select = document.getElementById('model-select');
            if(data.models.length > 0) {
                select.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join('');
            } else {
                select.innerHTML = '<option>Không tìm thấy model</option>';
            }
        }

        // Reset App
        function resetApp() {
            document.getElementById('gen-form').reset();
            document.getElementById('result-img').style.display = 'none';
            document.getElementById('placeholder-text').style.display = 'block';
            document.getElementById('msg').textContent = 'Đã làm mới phiên làm việc.';
        }

        // Clear Uploads
        async function clearUploads() {
            if(!confirm("Bạn có chắc muốn xóa tất cả ảnh đã tải lên? (Ảnh AI tạo sẽ được giữ lại)")) return;
            const res = await fetch('/api/clear-uploads', {method: 'POST'});
            const data = await res.json();
            alert(data.message || data.error);
        }

        // Handle Generate
        document.getElementById('gen-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('gen-btn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder-text');
            const resultImg = document.getElementById('result-img');
            
            btn.disabled = true;
            btn.textContent = "Đang tính toán...";
            loader.style.display = 'block';
            placeholder.style.display = 'none';
            resultImg.style.display = 'none';

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/generate', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    resultImg.src = `/media/outputs/${data.generated_image}`;
                    resultImg.style.display = 'block';
                    loader.style.display = 'none';
                } else {
                    alert("Lỗi: " + data.error);
                }
            } catch (err) {
                alert("Lỗi kết nối server.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Bắt đầu tạo ảnh";
                loader.style.display = 'none';
            }
        };

        loadModels();
    </script>
</body>
</html>
