<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux AI Studio Pro</title>
    <style>
        :root {
            --bg-color: #08080c;
            --panel-bg: #12121a;
            --primary: #00f0ff;
            --accent: #7000ff;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-color: #222230;
            --scale-factor: 1.3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(2rem * var(--scale-factor));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: calc(1000px * var(--scale-factor));
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: calc(2rem * var(--scale-factor));
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        h1 {
            grid-column: 1 / -1;
            font-size: calc(2.2rem * var(--scale-factor));
            text-align: center;
            color: var(--primary);
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: calc(1.5rem * var(--scale-factor));
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: calc(0.85rem * var(--scale-factor));
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background-color: #050508;
            border: 1px solid var(--border-color);
            color: white;
            padding: calc(0.8rem * var(--scale-factor));
            border-radius: 8px;
            margin-bottom: calc(1.5rem * var(--scale-factor));
            font-size: calc(0.9rem * var(--scale-factor));
            outline: none;
        }

        .hint {
            color: var(--text-muted);
            font-size: calc(0.75rem * var(--scale-factor));
            margin-top: calc(-1rem * var(--scale-factor));
            margin-bottom: calc(1rem * var(--scale-factor));
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        button {
            width: 100%;
            padding: calc(1rem * var(--scale-factor));
            font-size: calc(0.9rem * var(--scale-factor));
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { box-shadow: 0 0 20px var(--primary); }

        .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .btn-secondary:hover { color: white; border-color: white; }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-danger { background: #331111; color: #ff5555; border: 1px solid #552222; }
        .btn-danger:hover { background: #551111; color: #ff8888; }

        .output-area {
            min-height: calc(400px * var(--scale-factor));
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050508;
            position: relative;
            overflow: hidden;
        }

        .output-img { max-width: 100%; height: auto; display: none; }

        .loader {
            display: none;
            width: 60px;
            height: 60px;
            border: 5px solid #222;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>FLUX STUDIO PRO</h1>

        <div class="panel">
            <form id="gen-form">
                <label>Mô hình Klein</label>
                <select id="model-select" name="model"></select>

                <label>Câu lệnh miêu tả</label>
                <textarea id="prompt" name="prompt" rows="4" placeholder="Một phi hành gia trên sao hỏa, phong cách cyberpunk..." required></textarea>

                <label>Ảnh tham chiếu</label>
                <input type="file" id="images" name="images" multiple accept="image/*">
                <div class="hint">Tối đa 4 ảnh tham chiếu mỗi lần phân tích.</div>

                <button type="button" class="btn-secondary" id="analyze-ref-btn">Phân tích ảnh tham chiếu</button>

                <label style="margin-top: 1rem;">Prompt tham chiếu (có thể chỉnh tay)</label>
                <textarea id="reference-prompt" name="reference_prompt" rows="6" placeholder="Kết quả phân tích ảnh tham chiếu sẽ xuất hiện ở đây..."></textarea>

                <button type="submit" class="btn-primary" id="gen-btn">Bắt đầu tạo ảnh</button>
            </form>

            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="resetApp()">Làm mới (Reset)</button>
                <button type="button" class="btn-danger" onclick="clearUploads()">Dọn dẹp Uploads</button>
            </div>
            <div id="msg" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>
        </div>

        <div class="panel">
            <label>Kết quả đầu ra</label>
            <div class="output-area">
                <div class="loader" id="loader"></div>
                <div id="placeholder-text" style="color: #444;">Dữ liệu sẽ hiển thị tại đây</div>
                <img id="result-img" class="output-img">
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('gen-form');
        const imagesInput = document.getElementById('images');
        const referencePromptInput = document.getElementById('reference-prompt');
        const analyzeRefBtn = document.getElementById('analyze-ref-btn');

        const MAX_REFERENCE_IMAGES = 4;
        const RESIZE_MAX_SIDE = 1280;
        const RESIZE_OUTPUT_QUALITY = 0.85;

        function setMessage(text, isError = false) {
            const msg = document.getElementById('msg');
            msg.textContent = text || '';
            msg.style.color = isError ? '#ff6d6d' : '#7fd4ff';
        }

        function resetPreview(message = '', isError = false) {
            const resultImg = document.getElementById('result-img');
            const placeholder = document.getElementById('placeholder-text');
            resultImg.style.display = 'none';
            resultImg.removeAttribute('src');
            placeholder.style.display = 'block';
            setMessage(message, isError);
        }

        function getSelectedReferenceCount() {
            return imagesInput.files ? imagesInput.files.length : 0;
        }

        function hasSelectedReferenceImages() {
            return getSelectedReferenceCount() > 0;
        }

        function validateReferenceImageCount(showAlert = true) {
            const count = getSelectedReferenceCount();
            if (count <= MAX_REFERENCE_IMAGES) {
                return true;
            }

            const msg = `Bạn đã chọn ${count} ảnh. Tối đa ${MAX_REFERENCE_IMAGES} ảnh tham chiếu mỗi lần phân tích.`;
            setMessage(msg, true);
            if (showAlert) {
                alert(msg);
            }
            return false;
        }

        function updateAnalyzeButtonAvailability() {
            const count = getSelectedReferenceCount();
            analyzeRefBtn.disabled = count === 0 || count > MAX_REFERENCE_IMAGES;
            if (count === 0) {
                analyzeRefBtn.textContent = 'Phân tích ảnh tham chiếu';
            }
        }

        function setAnalyzeLoading(isLoading) {
            analyzeRefBtn.disabled = isLoading;
            analyzeRefBtn.textContent = isLoading ? 'Đang phân tích ảnh...' : 'Phân tích ảnh tham chiếu';
        }

        function getFileNameBase(filename) {
            const lastDotIndex = filename.lastIndexOf('.');
            if (lastDotIndex <= 0) {
                return filename || 'reference';
            }
            return filename.slice(0, lastDotIndex);
        }

        function optimizeReferenceImage(file) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();

                img.onload = () => {
                    try {
                        const maxSide = Math.max(img.width, img.height) || 1;
                        const ratio = Math.min(1, RESIZE_MAX_SIDE / maxSide);
                        const targetWidth = Math.max(1, Math.round(img.width * ratio));
                        const targetHeight = Math.max(1, Math.round(img.height * ratio));

                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;

                        const ctx = canvas.getContext('2d');
                        if (!ctx) {
                            URL.revokeObjectURL(objectUrl);
                            reject(new Error('Không khởi tạo được canvas context.'));
                            return;
                        }

                        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                        canvas.toBlob((blob) => {
                            URL.revokeObjectURL(objectUrl);
                            if (!blob) {
                                reject(new Error('Trình duyệt không tạo được blob ảnh sau resize.'));
                                return;
                            }

                            const optimized = new File(
                                [blob],
                                `${getFileNameBase(file.name)}.jpg`,
                                { type: 'image/jpeg', lastModified: Date.now() }
                            );
                            resolve(optimized);
                        }, 'image/jpeg', RESIZE_OUTPUT_QUALITY);
                    } catch (error) {
                        URL.revokeObjectURL(objectUrl);
                        reject(error);
                    }
                };

                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('File ảnh không hợp lệ hoặc không đọc được.'));
                };

                img.src = objectUrl;
            });
        }

        async function optimizeReferenceImages(files) {
            const optimizedFiles = [];
            for (const file of files) {
                try {
                    const optimized = await optimizeReferenceImage(file);
                    optimizedFiles.push(optimized);
                } catch (error) {
                    const reason = error && error.message ? error.message : 'Lỗi không xác định.';
                    throw new Error(`Không thể tối ưu ảnh "${file.name}": ${reason}`);
                }
            }
            return optimizedFiles;
        }

        async function loadModels() {
            const res = await fetch('/api/models');
            const data = await res.json();
            const select = document.getElementById('model-select');
            if (data.models.length > 0) {
                select.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join('');
            } else {
                select.innerHTML = '<option>Không tìm thấy model</option>';
            }
        }

        async function analyzeReferenceImages() {
            if (!hasSelectedReferenceImages()) {
                setMessage('Chưa có ảnh tham chiếu để phân tích.', true);
                alert('Vui lòng chọn ít nhất 1 ảnh tham chiếu.');
                return;
            }

            if (!validateReferenceImageCount(true)) {
                return;
            }

            setAnalyzeLoading(true);
            setMessage('Đang tối ưu ảnh tham chiếu...');

            try {
                const optimizedFiles = await optimizeReferenceImages(Array.from(imagesInput.files));

                setMessage('Đang phân tích ảnh tham chiếu...');
                const formData = new FormData();
                optimizedFiles.forEach((file) => {
                    formData.append('images', file);
                });

                const res = await fetch('/api/reference-analyze', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    referencePromptInput.value = data.reference_prompt || '';

                    const message = `Đã phân tích ảnh tham chiếu bằng ${data.source_model}. Bạn có thể chỉnh prompt tham chiếu trước khi generate.`;
                    setMessage(message, false);
                } else {
                    referencePromptInput.value = '';
                    const errorMessage = `Lỗi phân tích ảnh: ${data.error}`;
                    setMessage(errorMessage, true);
                    alert(errorMessage);
                }
            } catch (err) {
                referencePromptInput.value = '';
                const isResizeError = err && typeof err.message === 'string' && err.message.startsWith('Không thể tối ưu ảnh');
                const message = isResizeError
                    ? err.message
                    : 'Không thể kết nối server khi phân tích ảnh tham chiếu.';
                setMessage(message, true);
                alert(`Lỗi: ${message}`);
            } finally {
                setAnalyzeLoading(false);
                updateAnalyzeButtonAvailability();
            }
        }

        function resetApp() {
            form.reset();
            referencePromptInput.value = '';
            resetPreview('Đã làm mới phiên làm việc.');
            updateAnalyzeButtonAvailability();
        }

        async function clearUploads() {
            if (!confirm('Bạn có chắc muốn xóa tất cả ảnh đã tải lên? (Ảnh AI tạo sẽ được giữ lại)')) return;
            const res = await fetch('/api/clear-uploads', { method: 'POST' });
            const data = await res.json();
            alert(data.message || data.error);

            if (data.success) {
                imagesInput.value = '';
                referencePromptInput.value = '';
            }

            setMessage(data.message || data.error, !data.success);
            updateAnalyzeButtonAvailability();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('gen-btn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder-text');
            const resultImg = document.getElementById('result-img');

            if (!validateReferenceImageCount(true)) {
                return;
            }

            if (hasSelectedReferenceImages() && !referencePromptInput.value.trim()) {
                const msg = 'Bạn đã chọn ảnh tham chiếu nhưng chưa có prompt tham chiếu. Vui lòng bấm "Phân tích ảnh tham chiếu" trước khi tạo ảnh.';
                setMessage(msg, true);
                alert(msg);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang tính toán...';
            loader.style.display = 'block';
            placeholder.style.display = 'none';
            resultImg.style.display = 'none';
            resultImg.removeAttribute('src');
            setMessage('');

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/generate', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    resultImg.src = `/media/outputs/${data.generated_image}`;
                    resultImg.style.display = 'block';
                    loader.style.display = 'none';
                    setMessage(`Tạo ảnh thành công: ${data.generated_image}`);
                } else {
                    resetPreview(`Lỗi: ${data.error}`, true);
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                resetPreview('Lỗi kết nối server.', true);
                alert('Lỗi kết nối server.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Bắt đầu tạo ảnh';
                loader.style.display = 'none';
            }
        };

        imagesInput.addEventListener('change', () => {
            referencePromptInput.value = '';
            const count = getSelectedReferenceCount();

            if (count > 0 && count <= MAX_REFERENCE_IMAGES) {
                setMessage(`Đã chọn ${count} ảnh tham chiếu. Bấm "Phân tích ảnh tham chiếu" để tạo prompt.`);
            } else if (count > MAX_REFERENCE_IMAGES) {
                setMessage(`Bạn đã chọn ${count} ảnh. Tối đa ${MAX_REFERENCE_IMAGES} ảnh mỗi lần phân tích.`, true);
            } else {
                setMessage('');
            }

            updateAnalyzeButtonAvailability();
        });

        analyzeRefBtn.addEventListener('click', analyzeReferenceImages);

        document.getElementById('result-img').onerror = () => {
            resetPreview('Không thể hiển thị ảnh vừa tạo (file ảnh không hợp lệ).', true);
        };

        updateAnalyzeButtonAvailability();
        loadModels();
    </script>
</body>
</html>
